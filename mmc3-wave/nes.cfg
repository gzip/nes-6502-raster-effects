MEMORY {
  ZEROPAGE:  start = $00,   size = $FF;
  STACK:     start = $0100, size = $0100;
  OAMBUFFER: start = $0200, size = $0100;
  RAM:       start = $0300, size = $0500;

  HEADER:    start=$0000,   size = $10,   type = ro, file = %O, fill = yes, fillval = $00;
  ROM:       start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  ROM_FIXED: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;

  CHR_ROM:   start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
  ZEROPAGE:  load = ZEROPAGE,  type = zp;
  STACK:     load = STACK,     type = bss, optional = yes;
  OAM:       load = OAMBUFFER, type = bss, optional = yes;
  BSS:       load = RAM,       type = bss, optional = yes;

  HEADER:    load = HEADER,    type = ro;
  CODE:      load = ROM_FIXED, type = ro, align = $100;
  RODATA:    load = ROM_FIXED, type = ro, align = $100;
  DMC:       load = ROM_FIXED, type = ro, align = 64, optional = yes;
  VECTORS:   load = ROM_FIXED, type = ro, start = $FFFA;

  CHR:       load = CHR_ROM,   type = ro, align = 16, optional = yes;
}

FILES {
  %O: format = bin;
}